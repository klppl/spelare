<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- An original illustration standing in for a video frame: a fjord at golden hour. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F4B"/>
      <stop offset="0.38" stop-color="#5B3C88"/>
      <stop offset="0.62" stop-color="#E0717A"/>
      <stop offset="0.78" stop-color="#FFB46B"/>
      <stop offset="1" stop-color="#FFD9A0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#FFD48A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF9E6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E58A7C"/>
      <stop offset="0.35" stop-color="#7A4C8C"/>
      <stop offset="1" stop-color="#1F1A44"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7B5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE7B5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0628A"/>
      <stop offset="1" stop-color="#8A4F86"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A3F7F"/>
      <stop offset="1" stop-color="#4A2F6B"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2252"/>
      <stop offset="1" stop-color="#1A1436"/>
    </linearGradient>
    <filter id="haze"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Stars, fading into the dusk -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="320" cy="140" r="1.2" opacity="0.5"/>
    <circle cx="520" cy="60" r="1.4" opacity="0.6"/>
    <circle cx="1180" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="1380" cy="50" r="1.2" opacity="0.5"/>
    <circle cx="1490" cy="160" r="1.3" opacity="0.4"/>
    <circle cx="860" cy="40" r="1.1" opacity="0.5"/>
  </g>
  <!-- The sun, low between the mountains -->
  <circle cx="930" cy="505" r="260" fill="url(#sunGlow)"/>
  <circle cx="930" cy="505" r="62" fill="#FFF1CF"/>

  <!-- Mountains: far, middle, near -->
  <path d="M0 520 L120 455 L230 495 L360 420 L470 470 L560 440 L660 500 L760 470 L860 520 L1000 515 L1100 460 L1210 430 L1320 470 L1430 420 L1520 455 L1600 440 L1600 560 L0 560Z" fill="url(#far)" opacity="0.85" filter="url(#haze)"/>
  <path d="M0 560 L90 470 L170 500 L300 380 L380 430 L470 400 L620 540 L0 560Z" fill="url(#mid)"/>
  <path d="M1600 560 L1500 440 L1420 470 L1300 360 L1210 410 L1120 390 L980 540 L1600 560Z" fill="url(#mid)"/>
  <path d="M0 560 L0 470 L60 430 L150 520 L230 500 L330 560Z" fill="url(#near)"/>
  <path d="M1600 560 L1600 430 L1530 400 L1450 470 L1360 500 L1260 560Z" fill="url(#near)"/>

  <!-- Water and the sun's reflection -->
  <rect y="558" width="1600" height="342" fill="url(#water)"/>
  <path d="M0 560 L620 540 L980 540 L1600 560Z" fill="#000000" opacity="0.08"/>
  <path d="M905 562 L955 562 L1000 900 L860 900Z" fill="url(#streak)" opacity="0.28" filter="url(#haze)"/>
  <g stroke="#FFE7B5" stroke-linecap="round" opacity="0.7">
    <path d="M890 600 H970" stroke-width="3"/>
    <path d="M870 640 H990" stroke-width="2.5" opacity="0.8"/>
    <path d="M900 690 H1010" stroke-width="2.5" opacity="0.6"/>
    <path d="M860 750 H950" stroke-width="2" opacity="0.5"/>
    <path d="M940 810 H1040" stroke-width="2" opacity="0.4"/>
    <path d="M300 640 H380" stroke-width="2" opacity="0.25"/>
    <path d="M1250 700 H1340" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- A small boat on the water -->
  <g transform="translate(560 640)">
    <path d="M-34 0 H34 L24 12 H-24Z" fill="#1A1436"/>
    <path d="M0 0 V-46" stroke="#1A1436" stroke-width="3"/>
    <path d="M2 -44 L28 -4 H2Z" fill="#1A1436"/>
    <path d="M-30 18 H30" stroke="#FFE7B5" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#2A1F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 300 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M760 270 q9 -8 18 0 q9 -8 18 0"/>
    <path d="M660 250 q8 -7 16 0 q8 -7 16 0"/>
  </g>
</svg>
