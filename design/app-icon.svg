<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8576FF"/>
      <stop offset="1" stop-color="#3A22C4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2948"/>
      <stop offset="1" stop-color="#16132A"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E2FF"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7563FF"/>
      <stop offset="1" stop-color="#4128D6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14085A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g filter="url(#glyphShadow)">
    <!-- knobby tread, fused to the tire body -->
    <circle cx="512" cy="512" r="276" fill="none" stroke="url(#rubber)" stroke-width="36"
            stroke-dasharray="30 24.2" transform="rotate(-90 512 512)"/>
    <!-- tire body -->
    <circle cx="512" cy="512" r="212" fill="url(#rubber)"/>
    <circle cx="512" cy="512" r="270" fill="none" stroke="url(#rubber)" stroke-width="10"/>
    <circle cx="512" cy="512" r="266" fill="url(#rubber)"/>
    <!-- hub -->
    <circle cx="512" cy="512" r="166" fill="url(#hub)"/>
  </g>
  <!-- sidewall highlight -->
  <circle cx="512" cy="512" r="216" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
  <circle cx="512" cy="512" r="166" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10"/>
  <!-- play -->
  <path d="M478 438 L478 586 L584 512 Z" fill="url(#play)" stroke="url(#play)"
        stroke-width="30" stroke-linejoin="round"/>
</svg>
