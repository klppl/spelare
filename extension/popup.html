<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <table>
        <tr>
            <td>
                <p>YouTube</p>
            </td>
            <td>
                <div class="field">
                    <input type="checkbox" id="showToolbar" name="showToolbar" /><label for="showToolbar">Show quality buttons on the player</label>
                </div>
                <div class="field">
                    <input type="checkbox" id="autoplay" name="autoplay" /><label for="autoplay">Keep playing when a video ends</label>
                </div>
                <div class="field">
                    <input type="checkbox" id="resumePlayback" name="resumePlayback" /><label for="resumePlayback">Resume videos where I left off</label>
                </div>
                <div class="field">
                    <input type="checkbox" id="evenLoudness" name="evenLoudness" /><label for="evenLoudness">Even out loudness (turns loud videos down)</label>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <p>Default quality</p>
            </td>
            <td>
                <div class="field">
                    <select name="quality" id="quality">
                        <option value="auto">Auto, based on your connection</option>
                        <option value="144p">144p</option>
                        <option value="240p">240p</option>
                        <option value="360p">360p</option>
                        <option value="480p">480p</option>
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                        <option value="1440p">1440p</option>
                        <option value="2160p">2160p</option>
                        <option value="audio">Sound only</option>
                    </select>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <p>Captions</p>
            </td>
            <td>
                <div class="field">
                    <input type="checkbox" id="showCaption" name="showCaption" /><label for="showCaption">Turn captions on by default</label>
                </div>
                <div class="field">
                    Auto-translate into <select name="subtitles" id="subtitles">
                        <option value="system">Same as my Mac</option>
                        <option value="af">Afrikaans</option>
                        <option value="sq">Albanian</option>
                        <option value="am">Amharic</option>
                        <option value="ar">Arabic</option>
                        <option value="hy">Armenian</option>
                        <option value="az">Azerbaijani</option>
                        <option value="bn">Bangla</option>
                        <option value="eu">Basque</option>
                        <option value="be">Belarusian</option>
                        <option value="bs">Bosnian</option>
                        <option value="bg">Bulgarian</option>
                        <option value="my">Burmese</option>
                        <option value="ca">Catalan</option>
                        <option value="ceb">Cebuano</option>
                        <option value="zh-Hans">Chinese (Simplified)</option>
                        <option value="zh-Hant">Chinese (Traditional)</option>
                        <option value="co">Corsican</option>
                        <option value="hr">Croatian</option>
                        <option value="cs">Czech</option>
                        <option value="da">Danish</option>
                        <option value="nl">Dutch</option>
                        <option value="en">English</option>
                        <option value="eo">Esperanto</option>
                        <option value="et">Estonian</option>
                        <option value="fil">Filipino</option>
                        <option value="fi">Finnish</option>
                        <option value="fr">French</option>
                        <option value="gl">Galician</option>
                        <option value="ka">Georgian</option>
                        <option value="de">German</option>
                        <option value="el">Greek</option>
                        <option value="gu">Gujarati</option>
                        <option value="ht">Haitian Creole</option>
                        <option value="haw">Hawaiian</option>
                        <option value="ha">Hausa</option>
                        <option value="iw">Hebrew</option>
                        <option value="hi">Hindi</option>
                        <option value="hmn">Hmong</option>
                        <option value="hu">Hungarian</option>
                        <option value="is">Icelandic</option>
                        <option value="ig">Igbo</option>
                        <option value="id">Indonesian</option>
                        <option value="ga">Irish</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="jv">Javanese</option>
                        <option value="kn">Kannada</option>
                        <option value="kk">Kazakh</option>
                        <option value="km">Khmer</option>
                        <option value="rw">Kinyarwanda</option>

                        <option value="lv">Latvian</option>
                        <option value="lt">Lithuanian</option>
                        <option value="lb">Luxembourgish</option>

                        <option value="mi">Maori</option>

                        <option value="sv">Swedish</option>

                    </select>
                    <p class="note">Only works on videos that already have captions. YouTube does the translating, so some lines come out a bit odd.</p>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <p>Hide</p>
            </td>
            <td>
                <div class="field">
                    <input type="checkbox" id="hideShorts" name="hideShorts" /><label for="hideShorts">Shorts</label>
                </div>
                <div class="field">
                    <input type="checkbox" id="hideRecommendations" name="hideRecommendations" /><label for="hideRecommendations">Recommended videos and the home feed</label>
                </div>
                <div class="field">
                    <input type="checkbox" id="hideComments" name="hideComments" /><label for="hideComments">Comments</label>
                </div>
                <div class="field">
                    <input type="checkbox" id="hideEndScreens" name="hideEndScreens" /><label for="hideEndScreens">End screens and info cards</label>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <p>Dislikes</p>
            </td>
            <td>
                <div class="field">
                    <input type="checkbox" id="showDislikes" name="showDislikes" /><label for="showDislikes">Show dislike counts</label>
                    <p class="note">Estimated by Return YouTube Dislike. Each video you watch is looked up there by its ID.</p>
                </div>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <div class="field">
                    <button id="showDebugInfo">Show diagnostic log</button>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
