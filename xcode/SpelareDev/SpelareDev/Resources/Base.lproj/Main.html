<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="Spelare icon">
    <p class="state-unknown">Spelare runs inside Safari. Switch it on under Safari &gt; Preferences &gt; Extensions.</p>

    <p class="state-off">Spelare is off right now. You can flip it on under Safari &gt; Preferences &gt; Extensions.</p>
    <button class="open-preferences">Close this and open Safari Preferences…</button>
</body>
